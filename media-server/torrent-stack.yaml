# =============================================================================
# Automated torrent stack  (media-server LXC)
# *arr automation. qBittorrent runs inside the gluetun VPN container's network
# namespace, so all torrent traffic goes through the VPN (kill switch built in).
# Config: .env.torrent-stack  (see .env.torrent-stack.example)
# Run:    docker compose --env-file .env.torrent-stack -f torrent-stack.yaml up -d
# =============================================================================

services:
  # --- VPN --------------------------------------------------------------------
  gluetun-vpn:
    image: qmcgaw/gluetun
    container_name: gluetun-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=${VPN_TYPE}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - FIREWALL_VPN_INPUT_PORTS=${FIREWALL_VPN_INPUT_PORTS}
    volumes:
      - gluetun-config:/gluetun
    # Ports for services sharing this network namespace (qBittorrent) are published here
    ports:
      - 8080:8080 # qBittorrent web UI
      - 57623:57623/tcp # Torrent port (forwarded by VPN provider)
      - 57623:57623/udp
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - vpn_network
    restart: unless-stopped

  # --- Downloader (routed through VPN) ------------------------------------------
  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: service:gluetun-vpn # No own network: uses gluetun's
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=${QBT_WEBUI_PORT}
    volumes:
      - qbittorrent-config:/config
      - ${DOWNLOADS_PATH}:/downloads
    depends_on:
      gluetun-vpn:
        condition: service_healthy
    restart: unless-stopped

  # --- Indexers -----------------------------------------------------------------
  prowlarr:
    image: linuxserver/prowlarr
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - prowlarr-config:/config
    ports:
      - 9696:9696
    networks:
      - vpn_network
    depends_on:
      - gluetun-vpn
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest # Cloudflare challenge solver for Prowlarr
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - TZ=${TZ}
    ports:
      - 8191:8191
    networks:
      - vpn_network
    depends_on:
      - gluetun-vpn
    restart: unless-stopped

  # --- Library managers ---------------------------------------------------------
  sonarr:
    image: linuxserver/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - sonarr-config:/config
      - ${MEDIA_PATH}/tv:${MEDIA_PATH}/tv
      - ${DOWNLOADS_PATH}/complete/tv:/downloads/complete/tv
    ports:
      - 8989:8989
    networks:
      - vpn_network
    depends_on:
      - gluetun-vpn
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - radarr-config:/config
      - ${MEDIA_PATH}/movies:${MEDIA_PATH}/movies
      - ${DOWNLOADS_PATH}/complete/movies:/downloads/complete/movies
    ports:
      - 7878:7878
    networks:
      - vpn_network
    depends_on:
      - gluetun-vpn
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr # Subtitles
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - bazarr-config:/config
      - ${MEDIA_PATH}:${MEDIA_PATH}
    ports:
      - 6767:6767
    networks:
      - vpn_network
    depends_on:
      - gluetun-vpn
    restart: unless-stopped

  profilarr:
    image: santiagosayshey/profilarr:latest # Syncs quality profiles to Sonarr/Radarr
    container_name: profilarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - profilarr-config:/config
    ports:
      - 6868:6868
    networks:
      - vpn_network
    depends_on:
      - gluetun-vpn
    restart: unless-stopped

  # --- Maintenance --------------------------------------------------------------
  watchtower:
    image: nickfedor/watchtower:latest # Auto-updates containers on a schedule
    container_name: watchtower
    environment:
      - WATCHTOWER_SCHEDULE=${WATCHTOWER_SCHEDULE}
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  vpn_network:
    driver: bridge

volumes:
  gluetun-config:
  qbittorrent-config:
  prowlarr-config:
  sonarr-config:
  radarr-config:
  bazarr-config:
  profilarr-config:
